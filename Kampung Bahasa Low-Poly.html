<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kampung Bahasa Low-Poly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout: one screen. The 3D scene fills it; a name tag sits top-left, the readout top-right, the switches along the bottom. */
  :root {
    --ink: #1d2a1f;
    --paper: #fffaf0;
    --paper-soft: #f3ead6;
    --sun: #f6c945;
    --leaf: #3f9b57;
    --muted: #5d6b5f;
    --sky: #9fd8f0;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--sky); color: var(--ink); font-family: var(--body); font-weight: 700; overflow: hidden; position: relative; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }

  .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .tag, .readout, .dock { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }
  .tag { padding: 8px 14px; min-width: 0; }
  .tag h1 { margin: 0; font: 600 1.25rem/1.15 var(--display); text-wrap: balance; }
  .tag p { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }

  .readout { margin: 0; padding: 8px 12px; display: grid; grid-template-columns: repeat(6, auto); gap: 2px 10px; align-items: baseline; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .readout dt { color: var(--muted); }
  .readout dd { margin: 0; text-align: right; font-weight: 800; }
  .readout .fps { font: 600 1.15rem/1 var(--display); }

  .dock { align-self: flex-start; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; max-width: 100%; }
  .group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .group > span { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .seg button { font: 800 0.85rem var(--body); color: var(--ink); background: var(--paper); border: 0; border-left: 2px solid var(--ink); padding: 7px 11px; min-height: 36px; min-width: 38px; cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--sun); }
  .seg button:focus-visible, summary:focus-visible { outline: 3px solid var(--leaf); outline-offset: -3px; }
  details { min-width: 0; }
  summary { cursor: pointer; font-size: 0.85rem; padding: 7px 4px; }
  details[open] { flex-basis: 100%; }
  .more { display: flex; flex-wrap: wrap; gap: 10px 18px; padding-top: 8px; }
  .hint { flex-basis: 100%; margin: 0; font-size: 0.78rem; color: var(--muted); }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 58%, rgba(20, 24, 40, 0.28) 100%); }
  .fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--paper-soft); font-size: 1rem; }

  .stick { position: absolute; left: 20px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 124px; height: 124px; border-radius: 50%; background: color-mix(in srgb, var(--paper) 55%, transparent); border: 3px solid var(--ink); touch-action: none; }
  .stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); }

  @media (max-width: 560px) {
    .hud { top: 12px; gap: 8px; }
    .tag p, .hint { display: none; }
    .tag { padding: 6px 10px; }
    .tag h1 { font-size: 1rem; }
    .readout { padding: 6px 10px; }
    .readout .fps { font-size: 1rem; }
    .dock { gap: 8px 12px; padding: 8px 10px; }
    .seg button { padding: 6px 9px; }
  }
</style>

<canvas id="scene" aria-label="Pratinjau 3D: gedung kursus dan karakter yang bisa dijalankan"></canvas>

<div class="vig" aria-hidden="true"></div>
<div class="hud">
  <div class="bar">
    <div class="tag">
      <h1>Kampung Bahasa 3D</h1>
      <p>Jalankan Dinda keliling halaman, lalu ganti sudut kameranya.</p>
    </div>
    <dl class="readout" aria-live="off">
      <dt>FPS</dt><dd class="fps" id="fps">–</dd>
      <dt>Segitiga</dt><dd id="tris">–</dd>
      <dt>Draw call</dt><dd id="calls">–</dd>
    </dl>
  </div>
  <div class="dock">
    <div class="group"><span>Kamera</span>
      <div class="seg" role="group" aria-label="Sudut kamera">
        <button id="c1" data-c="1" aria-pressed="false">Orang ke-1</button>
        <button id="c2" data-c="2" aria-pressed="false">Ke-2</button>
        <button id="c3" data-c="3" aria-pressed="true">Ke-3</button>
      </div>
    </div>
    <div class="group"><span>Zoom</span>
      <div class="seg" role="group" aria-label="Zoom">
        <button id="zOut" aria-label="Jauhkan">−</button>
        <button id="zIn" aria-label="Dekatkan">+</button>
      </div>
    </div>
    <div class="group"><span>Grafik</span>
      <div class="seg" role="group" aria-label="Kualitas grafik">
        <button id="gLow" data-g="low" aria-pressed="false">Rendah</button>
        <button id="gMid" data-g="mid" aria-pressed="true">Sedang</button>
        <button id="gHigh" data-g="high" aria-pressed="false">Tinggi</button>
      </div>
    </div>
    <details>
      <summary>Uji performa</summary>
      <div class="more">
        <div class="group"><span>Pemain</span>
          <div class="seg" role="group" aria-label="Jumlah pemain">
            <button id="n1" data-n="1" aria-pressed="true">1</button>
            <button id="n20" data-n="20" aria-pressed="false">20</button>
            <button id="n50" data-n="50" aria-pressed="false">50</button>
          </div>
        </div>
        <div class="group"><span>Waktu</span>
          <div class="seg" role="group" aria-label="Waktu">
            <button id="tPagi" data-t="pagi" aria-pressed="true">Pagi</button>
            <button id="tSenja" data-t="senja" aria-pressed="false">Senja</button>
          </div>
        </div>
      </div>
    </details>
    <p class="hint" id="hint">Jalan: joystick, WASD, atau tombol panah. Seret layar untuk memutar kamera, gulir atau cubit untuk zoom.</p>
  </div>
</div>

<div class="stick" id="stick" role="application" aria-label="Joystick: seret untuk berjalan"><i id="knob"></i></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  var me = person({ skin: 0xe8b88a, top: 0xe5534b, legs: 0x2f4a7a, shoes: 0x2a2a3a, hair: 0x2b1d14, stripe: 0xffffff, pack: 0xf6c945 });
  me.g.position.set(0, 0, 7.5);
  me.g.rotation.y = Math.PI;
  var nadia = person({ skin: 0xe0ac7e, top: 0x3b82c4, legs: 0x2f4a7a, shoes: 0x5a4a3a, hijab: 0xf6c945, long: true, pack: 0x2f4a7a });
  nadia.g.position.set(3.2, 0, 10.5);
  var people = [];
  function spawn() {
    var p = person(looks());
    p.g.position.set(-8 + Math.random() * 16, 0, 3.6 + Math.random() * 10.5);
    p.g.rotation.y = Math.random() * 6;
    people.push(p);
  }
  // (the count includes you)
  function setPeople(n) {
    while (people.length < n - 1) spawn();
    while (people.length > n - 1) { var gone = people.pop(); blobs.splice(blobs.indexOf(gone.g.children[1]), 1); scene.remove(gone.g); }
  }
  function step(p, dt) {
    if (p.wait > 0) { p.wait -= dt; pose(p, 0, dt); return; }
    if (!p.target) p.target = [-8 + Math.random() * 16, 3.6 + Math.random() * 10.5];
    var dx = p.target[0] - p.g.position.x, dz = p.target[1] - p.g.position.z, d = Math.sqrt(dx * dx + dz * dz);
    if (d < 0.12) { p.target = null; if (Math.random() < 0.5) p.wait = 1 + Math.random() * 3; return; }
    var v = Math.min(d, p.speed * dt);
    p.g.position.x += (dx / d) * v; p.g.position.z += (dz / d) * v;
    var want = Math.atan2(dx, dz), a = want - p.g.rotation.y;
    a = Math.atan2(Math.sin(a), Math.cos(a));
    p.g.rotation.y += a * Math.min(1, dt * 8);
    pose(p, 1, dt);
  }
  function pose(p, walking, dt) {
    p.phase += dt * 6.2 * walking * (p.speed / 1.3);
    p.idle += dt;
    var s = Math.sin(p.phase) * walking, c = Math.cos(p.phase) * walking, breathe = Math.sin(p.idle * 1.8) * (1 - walking);
    p.L.hip.rotation.x = -s * 0.62; p.R.hip.rotation.x = s * 0.62;
    p.L.knee.rotation.x = Math.max(0, c) * 0.95 + 0.04; p.R.knee.rotation.x = Math.max(0, -c) * 0.95 + 0.04;
    p.aL.sh.rotation.x = s * 0.55; p.aR.sh.rotation.x = -s * 0.55;
    p.aL.sh.rotation.z = -0.13 - breathe * 0.015; p.aR.sh.rotation.z = 0.13 + breathe * 0.015;
    p.aL.el.rotation.x = -0.12 - walking * 0.35 - Math.max(0, s) * 0.3; p.aR.el.rotation.x = -0.12 - walking * 0.35 - Math.max(0, -s) * 0.3;
    p.body.position.y = Math.abs(s) * 0.03 * walking + breathe * 0.004;
    p.body.rotation.x = walking * 0.05;
    p.body.rotation.y = s * 0.07;
    p.head.rotation.y = -s * 0.05 + Math.sin(p.idle * 0.5) * 0.12 * (1 - walking);
  }

  // ---- time of day
  function setTime(t) {
    var d = t === "senja";
    skyU.top.value = col(d ? 0x3a3f8a : 0x3f9be0); skyU.low.value = col(d ? 0xffb070 : 0xd6f0ff);
    scene.fog.color.copy(col(d ? 0xf2b383 : 0xcfeaf8));
    document.documentElement.style.setProperty("--sky", d ? "#f2b383" : "#cfeaf8");
    hemi.color.copy(col(d ? 0xffc2a0 : 0xdcefff)); hemi.groundColor.copy(col(d ? 0x4a4470 : 0x9db87a)); hemi.intensity = d ? 0.7 : 0.85;
    sun.color.copy(col(d ? 0xff9450 : 0xfff2d8)); sun.intensity = d ? 1.9 : 1.6;
    sun.position.set(d ? -34 : 20, d ? 13 : 34, d ? 20 : 24);
    sun.target.position.set(0, 0, 5);
    sunDisc.position.copy(sun.position).normalize().multiplyScalar(140); sunDisc.lookAt(0, 0, 0);
    sunDisc.material.color.copy(col(d ? 0xffd08a : 0xfffbe8));
    cloudMat.color.copy(col(d ? 0xffc9b0 : 0xffffff));
    dusk.forEach(function (m) { m.emissiveIntensity = d ? 1 : 0; });
    lamps.forEach(function (l) { l.intensity = d ? 1.6 : 0; });
    renderer.toneMappingExposure = d ? 0.95 : 0.85;
  }
  // ---- graphics: Rendah has no real shadows (a soft round one under each person) and a coarser picture; Tinggi is the full picture
  function setQuality(q) {
    var dpr = window.devicePixelRatio || 1, size = q === "high" ? 2048 : 1024;
    lowQ = q === "low";
    sun.castShadow = !lowQ;
    if (sun.shadow.mapSize.x !== size) { sun.shadow.mapSize.set(size, size); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
    blobs.forEach(function (b) { b.visible = lowQ; });
    renderer.setPixelRatio(q === "low" ? 1 : Math.min(dpr, q === "high" ? 2 : 1.5));
    resize();
    try { localStorage.setItem("kb3d-grafik", q); } catch (e) { /* not kept: the choice lasts for this visit */ }
  }
  // the small life of the place: clouds drift, the flag waves, palm fronds sway, lily pads bob
  function ambient(dt, now) {
    if (still) return;
    var t = now / 1000;
    clouds.forEach(function (c) { c.position.x += dt * 0.6; if (c.position.x > 80) c.position.x = -80; });
    flagBits.forEach(function (b, i) { b.rotation.y = Math.sin(t * 3.2 - i * 0.7) * 0.2; });
    fronds.forEach(function (f, i) { f.rotation.z = Math.sin(t * 1.3 + i) * 0.045; });
    lilies.forEach(function (l, i) { l.position.y = 0.14 + Math.sin(t * 1.5 + i * 2) * 0.012; });
  }

  // ---- walking: the joystick or the keys, always relative to where the camera looks
  var keys = {}, joy = { x: 0, y: 0 };
  var KEYMAP = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
  window.addEventListener("keydown", function (e) { var k = KEYMAP[e.key.toLowerCase()]; if (k && !e.target.closest("button, summary")) { keys[k] = true; e.preventDefault(); } });
  window.addEventListener("keyup", function (e) { var k = KEYMAP[e.key.toLowerCase()]; if (k) keys[k] = false; });
  window.addEventListener("blur", function () { keys = {}; });
  var stick = document.getElementById("stick"), knob = document.getElementById("knob"), stickId = null;
  function stickMove(e) {
    var r = stick.getBoundingClientRect(), x = (e.clientX - r.left - r.width / 2) / 42, y = (e.clientY - r.top - r.height / 2) / 42, d = Math.hypot(x, y);
    if (d > 1) { x /= d; y /= d; }
    joy.x = x; joy.y = -y;
    knob.style.transform = "translate(" + x * 36 + "px," + y * 36 + "px)";
  }
  stick.addEventListener("pointerdown", function (e) { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
  stick.addEventListener("pointermove", function (e) { if (e.pointerId === stickId) stickMove(e); });
  function stickUp(e) { if (e.pointerId !== stickId) return; stickId = null; joy.x = joy.y = 0; knob.style.transform = ""; }
  stick.addEventListener("pointerup", stickUp);
  stick.addEventListener("pointercancel", stickUp);

  // the building and its porch are solid; the world ends at the trees
  var SOLID = [[-5.1, 5.1, -4.1, 1.7], [-1.9, 1.9, 1.7, 3.5], [-12.2, -9.2, 4.7, 8.5], [7.6, 11.6, 4.7, 7.7], [5.8, 8.4, 2, 3.1]];
  function blocked(x, z) {
    if (x * x + z * z > 27 * 27 || z > 14.9) return true;
    for (var i = 0; i < SOLID.length; i++) if (x > SOLID[i][0] - 0.3 && x < SOLID[i][1] + 0.3 && z > SOLID[i][2] - 0.3 && z < SOLID[i][3] + 0.3) return true;
    return false;
  }

  // ---- the cameras. 1: through Dinda's eyes. 2: through Nadia's eyes, who looks at Dinda. 3: behind Dinda, turned by dragging.
  var cam = { mode: 3, yaw: 0.35, pitch: 0.42, look: 0, dist: 8, fov1: 70, fov2: 42 };
  var fwd = { x: 0, z: -1 }, eye = new THREE.Vector3(), at = new THREE.Vector3();
  function setMode(m) {
    cam.mode = Number(m);
    me.g.visible = cam.mode !== 1;
    nadia.g.visible = cam.mode !== 2;
    // into her eyes or out of them without a jump: the camera keeps looking the way Dinda faces
    if (cam.mode !== 2) cam.yaw = Math.atan2(-Math.sin(me.g.rotation.y), -Math.cos(me.g.rotation.y));
  }
  function zoom(f) {
    if (cam.mode === 3) cam.dist = Math.max(2.5, Math.min(26, cam.dist * f));
    else if (cam.mode === 1) cam.fov1 = Math.max(28, Math.min(85, cam.fov1 * f));
    else cam.fov2 = Math.max(12, Math.min(70, cam.fov2 * f));
  }
  function walk(dt) {
    var ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0) + joy.x, iy = (keys.u ? 1 : 0) - (keys.d ? 1 : 0) + joy.y, n = Math.hypot(ix, iy);
    var P = me.g.position;
    if (cam.mode === 2) {
      var dx = P.x - nadia.g.position.x, dz = P.z - nadia.g.position.z, d = Math.hypot(dx, dz);
      if (d > 0.6) { fwd.x = dx / d; fwd.z = dz / d; }
      nadia.g.rotation.y = Math.atan2(fwd.x, fwd.z);
    } else { fwd.x = -Math.sin(cam.yaw); fwd.z = -Math.cos(cam.yaw); }
    if (n > 0.12) {
      if (n > 1) { ix /= n; iy /= n; n = 1; }
      var mx = fwd.x * iy - fwd.z * ix, mz = fwd.z * iy + fwd.x * ix, v = 3.4 * dt;
      if (!blocked(P.x + mx * v, P.z)) P.x += mx * v;
      if (!blocked(P.x, P.z + mz * v)) P.z += mz * v;
      if (cam.mode !== 1) {
        var a = Math.atan2(mx, mz) - me.g.rotation.y;
        me.g.rotation.y += Math.atan2(Math.sin(a), Math.cos(a)) * Math.min(1, dt * 12);
      }
      me.speed = 1.3 + n;
      pose(me, 1, dt);
    } else pose(me, 0, dt);
    if (cam.mode === 1) me.g.rotation.y = Math.atan2(fwd.x, fwd.z);
  }
  function place() {
    var P = me.g.position, fov;
    if (cam.mode === 1) {
      fov = cam.fov1;
      eye.set(P.x + fwd.x * 0.12, 1.47, P.z + fwd.z * 0.12);
      var c = Math.cos(cam.look);
      at.set(P.x + fwd.x * (0.12 + c), 1.47 + Math.sin(cam.look), P.z + fwd.z * (0.12 + c));
    } else if (cam.mode === 2) {
      fov = cam.fov2;
      eye.set(nadia.g.position.x, 1.47, nadia.g.position.z);
      at.set(P.x, 1.1, P.z);
    } else {
      fov = portrait ? 60 : 48;
      var cp = Math.cos(cam.pitch);
      at.set(P.x, 1.15, P.z);
      eye.set(P.x + Math.sin(cam.yaw) * cp * cam.dist, 1.15 + Math.sin(cam.pitch) * cam.dist, P.z + Math.cos(cam.yaw) * cp * cam.dist);
    }
    if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
    camera.position.copy(eye);
    camera.lookAt(at);
  }
  var touches = new Map(), pinch = 0, portrait = false;
  canvas.addEventListener("pointerdown", function (e) { canvas.setPointerCapture(e.pointerId); touches.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; });
  canvas.addEventListener("pointermove", function (e) {
    var was = touches.get(e.pointerId);
    if (!was) return;
    touches.set(e.pointerId, [e.clientX, e.clientY]);
    if (touches.size === 1) {
      var dx = e.clientX - was[0], dy = e.clientY - was[1];
      if (cam.mode === 2) return; // her eyes follow you: nothing to turn
      cam.yaw -= dx * 0.008;
      if (cam.mode === 1) cam.look = Math.max(-0.9, Math.min(0.9, cam.look + dy * 0.005));
      else cam.pitch = Math.max(0.06, Math.min(1.4, cam.pitch + dy * 0.006));
    } else if (touches.size === 2) {
      var p = Array.from(touches.values()), d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
      if (pinch) zoom(pinch / d);
      pinch = d;
    }
  });
  function lift(e) { touches.delete(e.pointerId); pinch = 0; }
  canvas.addEventListener("pointerup", lift);
  canvas.addEventListener("pointercancel", lift);
  canvas.addEventListener("wheel", function (e) { e.preventDefault(); zoom(1 + Math.sign(e.deltaY) * 0.08); }, { passive: false });
  document.getElementById("zIn").addEventListener("click", function () { zoom(0.8); });
  document.getElementById("zOut").addEventListener("click", function () { zoom(1.25); });

  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    portrait = w < h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  // ---- the switches
  function group(ids, key, apply) {
    ids.forEach(function (id) {
      document.getElementById(id).addEventListener("click", function (e) {
        ids.forEach(function (o) { document.getElementById(o).setAttribute("aria-pressed", String(o === id)); });
        apply(e.currentTarget.dataset[key]);
      });
    });
  }
  group(["c1", "c2", "c3"], "c", setMode);
  group(["n1", "n20", "n50"], "n", function (v) { setPeople(Number(v)); });
  group(["gLow", "gMid", "gHigh"], "g", setQuality);
  group(["tPagi", "tSenja"], "t", setTime);

  // ---- run
  var fpsEl = document.getElementById("fps"), trisEl = document.getElementById("tris"), callsEl = document.getElementById("calls");
  var last = performance.now(), frames = 0, since = last;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!still) for (var i = 0; i < people.length; i++) step(people[i], dt);
    walk(dt);
    ambient(dt, now);
    place();
    renderer.render(scene, camera);
    frames++;
    if (now - since >= 500) {
      fpsEl.textContent = String(Math.round((frames * 1000) / (now - since)));
      trisEl.textContent = renderer.info.render.triangles.toLocaleString("id-ID");
      callsEl.textContent = String(renderer.info.render.calls);
      frames = 0; since = now;
    }
    requestAnimationFrame(frame);
  }
  setTime("pagi");
  setPeople(1);
  var kept = null;
  try { kept = localStorage.getItem("kb3d-grafik"); } catch (e) { /* no storage: the default */ }
  document.getElementById({ low: "gLow", high: "gHigh" }[kept] || "gMid").click();
  place();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
